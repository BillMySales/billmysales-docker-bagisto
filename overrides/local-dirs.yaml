# Keep the stack's data in local directories instead of named volumes, so it
# is visible from the host (and easy to include in host-level backups).
#
# In .env:
#   COMPOSE_FILE=compose.yaml:overrides/local-dirs.yaml
#   DATA_DIR=./data        # optional, default ./data (relative to compose.yaml)
#
# Only the directories you keep here change; delete the lines you don't need
# (e.g. keep just `storage` and `backups`). Existing data in the named
# volumes is NOT moved: switch before the first `up`, or restore a backup
# afterwards. `public` holds only files copied from the image (setup copies
# them again when the image changes). A new `storage` directory is filled by
# setup from the image's storage/ tree and given to www-data (UID 82), also
# on Linux. Backup files are root-owned with mode 0600.

x-bagisto-dirs: &bagisto-dirs
  - ${DATA_DIR:-./data}/public:/var/www/bagisto/public
  - ${DATA_DIR:-./data}/storage:/var/www/bagisto/storage

services:
  db:
    volumes:
      - ${DATA_DIR:-./data}/db:/var/lib/mysql
  setup:
    volumes:
      - ${DATA_DIR:-./data}/public:/srv/public
      - ${DATA_DIR:-./data}/storage:/var/www/bagisto/storage
  php:
    volumes: *bagisto-dirs
  worker:
    volumes: *bagisto-dirs
  scheduler:
    volumes: *bagisto-dirs
  console:
    volumes: *bagisto-dirs
  caddy:
    volumes:
      - ${DATA_DIR:-./data}/public:/var/www/bagisto/public:ro
      - ${DATA_DIR:-./data}/storage:/var/www/bagisto/storage:ro
      - ${DATA_DIR:-./data}/caddy/data:/data
      - ${DATA_DIR:-./data}/caddy/config:/config
  backup:
    volumes:
      - ${DATA_DIR:-./data}/storage:/data/storage
      - ${DATA_DIR:-./data}/backups:/backups
